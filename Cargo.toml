[package]
name = "teurtask"
version = "1.9.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "teurtask_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "teurtask"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
