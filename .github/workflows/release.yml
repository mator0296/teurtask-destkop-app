name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          version=$(jq -r .version tauri.conf.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create or reuse draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # gh api escribe el body de error en stdout (no stderr) en respuestas
          # no-2xx, asi que hay que decidir por codigo de salida, no por si la
          # variable quedo vacia -- de lo contrario el JSON de error termina
          # metido en $release_id (confirmado en vivo: releaseId recibido por
          # tauri-action era literalmente {"message":"Not Found",...}).
          if resp=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" 2>/dev/null); then
            release_id=$(echo "$resp" | jq -r .id)
          else
            resp=$(gh api "repos/${{ github.repository }}/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="${{ github.sha }}" \
              -f name="teurtask $TAG" \
              -F draft=true \
              -F generate_release_notes=true)
            release_id=$(echo "$resp" | jq -r .id)
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev libgtk-3-dev build-essential

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: '.'
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.create-release.outputs.tag }}" \
            --draft=false --latest \
            --repo "${{ github.repository }}"
